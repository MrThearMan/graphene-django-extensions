[project]
name = "graphene-django-extensions"
version = "0.4.9"
description = "Extensions for graphene-django"
authors = [
    { name = "Matti Lamppu", email = "lamppu.matti.akseli@gmail.com" },
]
license = "MIT"
readme = "README.md"
keywords = [
    "django",
    "graphene",
    "extensions",
    "graphql",
    "graphene-django",
    "mutations",
    "queries",
    "object_types",
    "fields",
]
classifiers = [
    "Environment :: Web Environment",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Framework :: Django :: 5.2",
    "Framework :: Django :: 6.0",
    "Framework :: Django :: 6.1",
    "Framework :: Pytest",
]
requires-python = ">=3.12"
dependencies = [
    "Django>=5.2.18",
    "djangorestframework>=3.18.3",
    "graphene-django>=3.0.0",
    "graphene-django-query-optimizer>=0.10.16",
    "django-settings-holder>=0.1.2",
    "django-filter>=26.2",
]

[project.optional-dependencies]
files = ["pillow>=12.3.0"]
translation = ["django-modeltranslation>=0.20.6"]

[project.urls]
"Homepage" = "https://mrthearman.github.io/graphene-django-extensions"
"Repository" = "https://github.com/MrThearMan/graphene-django-extensions"
"Bug Tracker" = "https://github.com/MrThearMan/graphene-django-extensions/issues"
"Documentation" = "https://mrthearman.github.io/graphene-django-extensions"

[project.entry-points.pytest11]
graphene_django_extensions = "gdx_pytest.fixtures"

[dependency-groups]
# Development installs the library with every extra, so that "uv run" needs no
# extra flags and every optional integration is importable.
dev = [
    "graphene-django-extensions[files,translation]",
]
test = [
    "pytest==9.1.1",
    "pytest-django==4.14.0",
    "coverage==7.16.2",
    "nox==2026.8.17",
    "factory-boy==3.3.3",
    "django-graphiql-debug-toolbar==0.2.0",
]
docs = [
    "mkdocs==1.6.1",
    "pymdown-extensions==12.3",
]
lint = [
    "pre-commit==4.6.2",
]

[tool.uv]
default-groups = "all"

[tool.uv.sources]
# Lets the "dev" group name this project's own extras.
graphene-django-extensions = { workspace = true }

[tool.uv.build-backend]
# The packages are at the repository root, not under "src".
module-root = ""
module-name = [
    "graphene_django_extensions",
    "gdx_pytest",
]

[tool.coverage.run]
relative_files = true

[tool.coverage.report]
omit = [
    "tests/*",
    "docs/*",
    ".venv/*",
    ".tox/*",
]
exclude_lines = [
    "if TYPE_CHECKING:",
    "except ImportError:",
    "pragma: no cover",
    "pass",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "example_project.config.settings"
addopts = "-vv -s --disable-warnings"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"
